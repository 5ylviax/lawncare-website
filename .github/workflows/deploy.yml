name: Deploy to Server

on:
  workflow_run:
    workflows: ["Go"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: lawncare-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Download the tested build
        uses: actions/download-artifact@v8
        with:
          name: lawncare
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$BUILD_SHA" != "$main_sha" ]; then
            echo "A newer commit is on main. Skipping this release."
            exit 0
          fi

          gh release create "deploy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            lawncare.tar.gz \
            --target "$BUILD_SHA" \
            --latest \
            --title "Lawn Care ${BUILD_SHA:0:7}" \
            --notes "Build from a successful CI run on main."